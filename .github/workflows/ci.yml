name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, type-check and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Prisma 7 reads DATABASE_URL from prisma.config.ts; build does not need real data.
      DATABASE_URL: file:./dev.db
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        # src/generated/prisma is git-ignored, so it must be generated before lint/tsc/build.
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Create database schema
        # Pages are prerendered during `next build` and query the database, so the
        # schema must exist. dev.db is git-ignored, so CI starts with an empty file.
        run: npx prisma migrate deploy

      - name: Build
        run: npm run build
